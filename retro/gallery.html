<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-theme-toggle]") : null;
    if (!el) return;
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    var icons = document.querySelectorAll("[data-theme-toggle] i");
    for (var i = 0; i < icons.length; i++) icons[i].className = next === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
  });
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | St. Francis Secondary School</title>
  <meta name="description" content="Photo albums of St. Francis Secondary School — campus, classrooms, sports, cultural events and student life.">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.16/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme-retro.css">

  <!-- Page-scoped styles for albums (Gallery page only, does not touch style.css) -->
  <style>
    .album-card { cursor: pointer; opacity: 0; animation: albumFadeIn .7s ease forwards; }
    @keyframes albumFadeIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .album-card .img-card .overlay { opacity: 1; background: linear-gradient(to top, rgba(46,8,17,.88), transparent 65%); }
    .album-card .img-card .overlay p { color: rgba(255,255,255,.85); }
    .album-count-badge {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      background: rgba(46,8,17,.72); color: #fff; font-size: 12px; font-weight: 700;
      padding: 5px 12px; border-radius: 20px; letter-spacing: .3px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .album-count-badge i { color: var(--gold); font-size: 11px; }

    .album-viewer-grid { columns: 4; column-gap: 16px; }
    .album-viewer-grid .av-item { break-inside: avoid; margin-bottom: 16px; border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .album-viewer-grid .av-item img { width: 100%; display: block; transition: .5s; }
    .album-viewer-grid .av-item:hover img { transform: scale(1.06); }
    @media (max-width: 992px) { .album-viewer-grid { columns: 3; } }
    @media (max-width: 768px) { .album-viewer-grid { columns: 2; } }
    @media (max-width: 480px) { .album-viewer-grid { columns: 1; } }
  </style>
</head>
<body>

  <header data-component></header>

  <main>
    <!-- ===================== DEFAULT VIEW: album list ===================== -->
    <div id="galleryDefaultView">
      <section class="page-hero">
        <div class="bg" style="background-image:url('assets/img/banner-image.jpeg')"></div>
        <div class="container">
          <h1 class="reveal">School Gallery</h1>
          <div class="crumbs reveal delay-1 mt-4"><a href="index.html">Home</a><span class="sep">/</span><span>Gallery</span></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head text-center">
            <span class="eyebrow justify-content-center">Photo Albums</span>
            <h2 class="section-title">Moments From <span class="g">School Life</span></h2>
            <p class="section-sub mx-auto" style="text-align:center">Click an album to view all photos.</p>
          </div>

          <div class="row g-4" id="albumGrid" data-stagger>
            <!-- Albums are rendered here by JS from the ALBUMS data below -->
          </div>
        </div>
      </section>
    </div>

    <!-- ===================== ALBUM DETAIL VIEW (hidden until an album is clicked) ===================== -->
    <div id="albumDetailView" style="display:none">
      <section class="page-hero">
        <div class="bg" style="background-image:url('assets/img/banner-image.jpeg')"></div>
        <div class="container">
          <h1 class="reveal" id="albumViewerTitle">Album Name</h1>
          <div class="crumbs reveal delay-1 mt-4">
            <a href="#" id="albumBack">Gallery</a><span class="sep">/</span><span id="albumViewerCrumb">Album Name</span>
          </div>
        </div>
      </section>

      <section class="section" style="padding-top:36px">
        <div class="container">
          <div class="d-flex justify-content-end mb-4">
            <button type="button" class="btn-circle" id="albumClose" aria-label="Close album">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="album-viewer-grid" id="albumViewerGrid"></div>
        </div>
      </section>
    </div>
  </main>

  <footer data-component></footer>

  <!-- Single-image lightbox with prev/next, scoped to the currently open album -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <span class="lb-close">&times;</span>
    <span class="lb-nav prev">&#10094;</span>
    <img src="" alt="Gallery image">
    <span class="lb-nav next">&#10095;</span>
    <div class="lb-caption"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>

  <!-- Album gallery logic: builds album covers, switches to album detail view, opens lightbox -->
  <script>
    (function () {
      var ALBUMS = [
        {
          id: "campus",
          name: "RAKHI MAKING COMPETITION ",
          photos: [
            { src: "assets/img/sciencelab.jpg", caption: "RAKHI MAKING COMPETITION" },
            { src: "assets/img/rk.jpg", caption: "RAKHI MAKING COMPETITION" },
            { src: "assets/img/rk2.jpg", caption: "RAKHI MAKING COMPETITION" }
          ]
        },
        {
          id: "classrooms",
          name: "DIYA MAKING COMPETITION",
          photos: [
            { src: "assets/img/p3.jpg", caption: "DIYA MAKING COMPETITION" },
            { src: "assets/img/p4.jpg", caption: "DIYA MAKING COMPETITION" },
            { src: "assets/img/Learning.jpg", caption: "DIYA MAKING COMPETITION" }
          ]
        },
        {
          id: "sports",
          name: "VOLLEYBALL COMPETITION FOR PRIMARY & JUNIOR",
          photos: [
            { src: "assets/img/Voley.jpg", caption: "VOLLEYBALL COMPETITION FOR PRIMARY & JUNIOR" },
            { src: "assets/img/v2.jpg", caption: "VOLLEYBALL COMPETITION FOR PRIMARY & JUNIOR" },
            { src: "assets/img/v3.jpg", caption: "VOLLEYBALL COMPETITION FOR PRIMARY & JUNIOR" }
          ]
        },
        {
          id: "culture",
          name: "BIRTHDAY CELEBRATION OF PRINCIPAL REV FR SURESH DSOUZ",
          photos: [
            { src: "assets/img/Dance.jpg", caption: "BIRTHDAY CELEBRATION OF PRINCIPAL REV FR SURESH DSOUZ" },
            { src: "assets/img/learnful.jpg", caption: "BIRTHDAY CELEBRATION OF PRINCIPAL REV FR SURESH DSOUZ" },
            { src: "assets/img/d2.jpg", caption: "BIRTHDAY CELEBRATION OF PRINCIPAL REV FR SURESH DSOUZ" }
          ]
        },
        {
          id: "events",
          name: "School Events",
          photos: [
            { src: "assets/img/Photo34.jpg", caption: "Science exhibition" },
            { src: "assets/img/dd.jpg", caption: "Conference crowd" }
          ]
        }
      ];

      document.addEventListener("DOMContentLoaded", function () {
        var albumGrid = document.getElementById("albumGrid");
        var defaultView = document.getElementById("galleryDefaultView");
        var detailView = document.getElementById("albumDetailView");
        var albumViewerGrid = document.getElementById("albumViewerGrid");
        var albumViewerTitle = document.getElementById("albumViewerTitle");
        var albumViewerCrumb = document.getElementById("albumViewerCrumb");
        var albumBack = document.getElementById("albumBack");
        var albumClose = document.getElementById("albumClose");

        var lightbox = document.getElementById("lightbox");
        var lbImg = lightbox.querySelector("img");
        var lbCaption = lightbox.querySelector(".lb-caption");
        var lbClose = lightbox.querySelector(".lb-close");
        var lbPrev = lightbox.querySelector(".lb-nav.prev");
        var lbNext = lightbox.querySelector(".lb-nav.next");

        var currentAlbum = null;
        var currentIndex = 0;

        // ---------- Render album cover cards ----------
        ALBUMS.forEach(function (album, i) {
          var col = document.createElement("div");
          col.className = "col-md-6 col-lg-4 album-card";
          col.style.animationDelay = (i * 0.08) + "s";
          col.setAttribute("data-album", album.id);
          col.innerHTML =
            '<div class="img-card" style="height:280px;position:relative">' +
              '<span class="album-count-badge"><i class="fa-solid fa-images"></i>' + album.photos.length + ' Photos</span>' +
              '<img src="' + album.photos[0].src + '" alt="' + album.name + '">' +
              '<div class="overlay"><div><h5>' + album.name + '</h5><p>Tap to view album</p></div></div>' +
            '</div>';
          col.addEventListener("click", function () {
            openAlbum(album.id);
          });
          albumGrid.appendChild(col);
        });

        // ---------- Switch from album list to album detail (same page, like navigating) ----------
        function openAlbum(albumId) {
          var album = ALBUMS.filter(function (a) { return a.id === albumId; })[0];
          if (!album) return;
          currentAlbum = album;

          albumViewerTitle.textContent = album.name;
          albumViewerCrumb.textContent = album.name;

          albumViewerGrid.innerHTML = "";
          album.photos.forEach(function (photo, idx) {
            var item = document.createElement("div");
            item.className = "av-item";
            item.innerHTML = '<img src="' + photo.src + '" alt="' + photo.caption + '">';
            item.addEventListener("click", function () {
              openLightbox(idx);
            });
            albumViewerGrid.appendChild(item);
          });

          defaultView.style.display = "none";
          detailView.style.display = "block";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function closeAlbum(e) {
          if (e) e.preventDefault();
          detailView.style.display = "none";
          defaultView.style.display = "block";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        albumBack.addEventListener("click", closeAlbum);
        albumClose.addEventListener("click", closeAlbum);

        // ---------- Single-image lightbox with prev/next inside current album ----------
        function openLightbox(index) {
          if (!currentAlbum) return;
          currentIndex = index;
          updateLightbox();
          lightbox.classList.add("show");
        }

        function updateLightbox() {
          var photo = currentAlbum.photos[currentIndex];
          lbImg.src = photo.src;
          lbImg.alt = photo.caption;
          lbCaption.textContent = photo.caption;
        }

        function closeLightbox() {
          lightbox.classList.remove("show");
        }

        function showPrev() {
          if (!currentAlbum) return;
          currentIndex = (currentIndex - 1 + currentAlbum.photos.length) % currentAlbum.photos.length;
          updateLightbox();
        }

        function showNext() {
          if (!currentAlbum) return;
          currentIndex = (currentIndex + 1) % currentAlbum.photos.length;
          updateLightbox();
        }

        lbClose.addEventListener("click", closeLightbox);
        lbPrev.addEventListener("click", showPrev);
        lbNext.addEventListener("click", showNext);
        lightbox.addEventListener("click", function (e) {
          if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener("keydown", function (e) {
          if (lightbox.classList.contains("show")) {
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") showPrev();
            if (e.key === "ArrowRight") showNext();
          } else if (detailView.style.display === "block" && e.key === "Escape") {
            closeAlbum();
          }
        });
      });
    })();
  </script>
</body>
</html>
